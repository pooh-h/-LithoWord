name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node-tests:
    name: core logic tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: run core tests
        run: node tests/core.test.js

  js-syntax:
    name: js syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: node --check
        run: |
          for f in assets/*.js tests/*.js; do
            echo "checking $f"
            node --check "$f"
          done

  python-syntax:
    name: python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: compileall
        run: python -m compileall -q tools
