name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: 鏍稿績閫昏緫娴嬭瘯 (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 璺戞祴璇?        run: node tests/core.test.js

  syntax:
    name: 鍓嶇鑴氭湰璇硶妫€鏌?    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --check
        run: |
          for f in assets/*.js tests/*.js; do
            echo "checking $f"
            node --check "$f"
          done

  python:
    name: 鍔╂墜鑴氭湰璇硶妫€鏌?(python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compileall
        run: python -m compileall -q tools
