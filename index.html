<!-- 侧边导轨 -->
<aside class="rail">
  <a class="brand" href="#/today" title="岩语 LithoWord">
    <svg><use href="#i-crystal"/></svg>
  </a>
  <div class="brand-txt">LithoWord</div>
  <nav class="nav" aria-label="主导航">
    <a href="#/today" data-nav="today"><svg><use href="#i-today"/></svg><span>今日</span></a>
    <a href="#/review" data-nav="review"><svg><use href="#i-review"/></svg><span>复习</span><i class="nav-dot" id="navDueDot" hidden></i></a>

<!-- 主区 -->
<div class="shell">
  <div class="wrap">
    <header class="topbar">
      <div class="topbar-title">
        <span class="eyebrow" id="tbEyebrow">FIELD NOTE · 今日</span>
        <h1 id="tbTitle">薄片台</h1>
      </div>
      <div class="topbar-spacer"></div>
      <form class="capture" id="quickForm" autocomplete="off">
        <svg><use href="#i-search"/></svg>
        <input id="quickInput" type="text" placeholder="搜我的词，或敲新词回车收录" aria-label="搜索已收录单词，或快速收录新词" spellcheck="false">
        <span class="kbd-hint"><kbd>/</kbd> 搜 <kbd>Tab</kbd>×2</span>
        <button class="btn-mini" type="submit">收录</button>
      </form>
      <button class="icon-btn" id="ctxBtn" title="带原文语境收录">
        <svg><use href="#i-quote"/></svg>
      </button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <footer class="foot">
      <span>岩语 · LithoWord</span><i class="sep"></i>
      <span>地质学专业词汇工作台</span><i class="sep"></i>
      <span>本地存储 · 不上传任何词条</span>
      <span class="right" id="footAgent">AGENT OFFLINE</span>
    </footer>
  </div>
</div>
